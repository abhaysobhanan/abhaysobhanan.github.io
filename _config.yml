# -----------------------------------------------------------------------------
#  Build settings (GitHub Pages compatible; no need to touch these)
# -----------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

permalink: pretty
include:
  - _pages
exclude:
  - README.md
  - LICENSE
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - package.json
  - node_modules
  - vendor
  - "*.ipynb"

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-seo-tag
