{%- assign a = site.author -%}
<footer class="site-footer">
  <div class="frame">
    <div class="col">
      <h2>Contact</h2>
      <address>
        {{ a.name }}<br>
        {{ a.office }}<br>
        {%- for line in a.address %}
        {{ line }}<br>
        {%- endfor %}
      </address>
      <p><a href="mailto:{{ a.email }}">{{ a.email }}</a></p>
      <p>Office phone {{ a.phone }}</p>
      <p class="updated">Updated {{ site.time | date: "%B %Y" }}</p>
    </div>
  </div>
</footer>
